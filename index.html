<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your simple, lightning-fast workspace for thoughts and tasks.</p>
  </header>

  <main>
    <!-- Section 1: Add a note -->
    <section id="add-note-section">
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note text:</label>
        <input type="text" id="note-input" placeholder="What's on your mind?">

        <label for="note-category">Category:</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>

        <button type="submit" id="add-btn">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <!-- Section 2: Your notes -->
    <section id="your-notes-section">
      <h2>Your notes</h2>
      <div class="search-controls">
        <label for="search-input">Search notes:</label>
        <input type="text" id="search-input" placeholder="Filter notes by keyword...">
        <button type="button" id="clear-all-btn">Clear all</button>
      </div>
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built with vanilla web standards.</p>
  </footer>
</body>
</html>
